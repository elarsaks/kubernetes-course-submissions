name: Log Output GitOps

on:
  push:
    branches:
      - master
    paths:
      - log_output/**
      - .github/workflows/log-output-gitops.yaml

permissions:
  contents: write

env:
  IMAGE: elarsaks/log-output

jobs:
  build-publish-release:
    name: Build, publish, and update GitOps state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        run: |
          docker build --tag "$IMAGE:$GITHUB_SHA" ./log_output
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tag
        working-directory: log_output
        run: kustomize edit set image "$IMAGE=$IMAGE:$GITHUB_SHA"

      - name: Commit GitOps state
        run: |
          if git diff --quiet -- log_output/kustomization.yaml; then
            echo "Image tag is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log_output/kustomization.yaml
          git commit -m "Release log output image $GITHUB_SHA [skip ci]"
          git push
