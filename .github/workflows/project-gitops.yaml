name: The Project GitOps

on:
  push:
    branches:
      - master
    paths:
      - kustomization.yaml
      - the_project/**
      - todo_backend/**
      - todo_generator/**
      - broadcaster/**
      - .github/workflows/project-gitops.yaml

permissions:
  contents: write

concurrency:
  group: project-gitops-master
  cancel-in-progress: false

env:
  IMAGE_PREFIX: elarsaks

jobs:
  build-publish-release:
    name: Build, publish, and update GitOps state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish images
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE_PREFIX/the-project:$GITHUB_SHA" \
            --push ./the_project
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE_PREFIX/todo-backend:$GITHUB_SHA" \
            --push ./todo_backend
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE_PREFIX/todo-generator:$GITHUB_SHA" \
            --push ./todo_generator
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file ./todo_backend/Dockerfile.backup \
            --tag "$IMAGE_PREFIX/todo-postgres-backup:$GITHUB_SHA" \
            --push ./todo_backend
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE_PREFIX/todo-broadcaster:$GITHUB_SHA" \
            --push ./broadcaster

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags
        run: |
          kustomize edit set image PROJECT/IMAGE="$IMAGE_PREFIX/the-project:$GITHUB_SHA"
          kustomize edit set image elarsaks/todo-backend="$IMAGE_PREFIX/todo-backend:$GITHUB_SHA"
          kustomize edit set image elarsaks/todo-generator="$IMAGE_PREFIX/todo-generator:$GITHUB_SHA"
          kustomize edit set image elarsaks/todo-postgres-backup="$IMAGE_PREFIX/todo-postgres-backup:$GITHUB_SHA"
          kustomize edit set image elarsaks/todo-broadcaster="$IMAGE_PREFIX/todo-broadcaster:$GITHUB_SHA"

      - name: Commit GitOps state
        run: |
          if git diff --quiet -- kustomization.yaml; then
            echo "Image tags are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Release project images $GITHUB_SHA [skip ci]"
          git push
