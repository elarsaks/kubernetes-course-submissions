apiVersion: v1
kind: ConfigMap
metadata:
  name: log-output-config
  namespace: exercises
data:
  information.txt: this text is from file
  MESSAGE: hello world
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.0
          command: ["sh", "-c", "until pg_isready -h postgres -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"; do sleep 2; done"]
          envFrom:
            - secretRef:
                name: ping-pong-postgres
      containers:
        - name: ping-pong
          image: ping-pong:5.3
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - secretRef:
                name: ping-pong-postgres
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ping-pong
  namespace: exercises
spec:
  selector:
    app: ping-pong
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: config
          configMap:
            name: log-output-config
      containers:
        - name: writer
          image: log-output:5.3
          imagePullPolicy: IfNotPresent
          command: ["node", "writer.js"]
          volumeMounts:
            - name: shared-data
              mountPath: /usr/src/app/files
        - name: server
          image: log-output:5.3
          imagePullPolicy: IfNotPresent
          command: ["node", "server.js"]
          env:
            - name: PING_PONG_URL
              value: http://ping-pong:3000/
            - name: GREETER_URL
              value: http://greeter-svc/
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /status
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: shared-data
              mountPath: /usr/src/app/files
            - name: config
              mountPath: /usr/src/app/config
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: log-output
  namespace: exercises
spec:
  selector:
    app: log-output
  ports:
    - port: 3000
