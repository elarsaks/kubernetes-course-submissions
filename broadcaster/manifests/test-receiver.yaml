apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-test-receiver
  namespace: project
data:
  server.js: |
    const http = require("node:http");

    http.createServer((req, res) => {
      let body = "";
      req.on("data", (chunk) => { body += chunk; });
      req.on("end", () => {
        console.log(`WEBHOOK ${body}`);
        res.writeHead(200);
        res.end("ok");
      });
    }).listen(8080, () => console.log("Webhook test receiver listening on port 8080"));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-test-receiver
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-test-receiver
  template:
    metadata:
      labels:
        app: webhook-test-receiver
    spec:
      containers:
        - name: receiver
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: script
          configMap:
            name: webhook-test-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-test-receiver
  namespace: project
spec:
  selector:
    app: webhook-test-receiver
  ports:
    - port: 8080
      targetPort: 8080
