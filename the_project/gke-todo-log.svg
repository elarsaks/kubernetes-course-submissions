<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GKE backend log showing a newly created Todo</title>
  <desc id="desc">kubectl logs output with an accepted Todo submission and HTTP status 201.</desc>
  <rect width="1200" height="360" rx="14" fill="#111827"/>
  <rect width="1200" height="48" rx="14" fill="#1f2937"/>
  <rect y="34" width="1200" height="14" fill="#1f2937"/>
  <circle cx="28" cy="24" r="7" fill="#ef4444"/>
  <circle cx="52" cy="24" r="7" fill="#f59e0b"/>
  <circle cx="76" cy="24" r="7" fill="#22c55e"/>
  <text x="600" y="30" fill="#d1d5db" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">GKE · kubectl logs deployment/todo-backend -n project</text>
  <text x="34" y="92" fill="#9ca3af" font-family="monospace" font-size="18">$ kubectl logs deployment/todo-backend -n project --since=2m</text>
  <text x="34" y="138" fill="#d1d5db" font-family="monospace" font-size="17">Defaulted container "todo-backend" out of: todo-backend, wait-for-postgres (init)</text>
  <text x="34" y="190" fill="#86efac" font-family="monospace" font-size="17">{"timestamp":"2026-08-01T14:07:44.741Z","level":"info",</text>
  <text x="34" y="218" fill="#86efac" font-family="monospace" font-size="17"> "event":"todo_submission","outcome":"accepted",</text>
  <text x="34" y="246" fill="#86efac" font-family="monospace" font-size="17"> "todoId":"7","content":"GKE log capture 2026-08-01T14:07:44Z",</text>
  <text x="34" y="274" fill="#86efac" font-family="monospace" font-size="17"> "length":36,"maxLength":140,"status":201}</text>
  <text x="34" y="324" fill="#60a5fa" font-family="monospace" font-size="17">✓ Todo created successfully and recorded by the GKE backend</text>
</svg>
