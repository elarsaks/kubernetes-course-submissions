apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikipedia
  template:
    metadata:
      labels:
        app: wikipedia
    spec:
      volumes:
        - name: wikipedia-content
          emptyDir: {}
      initContainers:
        - name: download-kubernetes-page
          image: curlimages/curl:8.16.0
          securityContext:
            runAsUser: 0
          command:
            - curl
            - --fail
            - --silent
            - --show-error
            - --location
            - --retry
            - "5"
            - --user-agent
            - kubernetes-course-exercise/5.4
            - --output
            - /www/index.html
            - https://en.wikipedia.org/wiki/Kubernetes
          volumeMounts:
            - name: wikipedia-content
              mountPath: /www
      containers:
        - name: nginx
          image: nginx:1.29.1-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: wikipedia-content
              mountPath: /usr/share/nginx/html
              readOnly: true
        - name: wikipedia-refresher
          image: curlimages/curl:8.16.0
          securityContext:
            runAsUser: 0
          env:
            - name: MIN_REFRESH_SECONDS
              value: "300"
            - name: MAX_REFRESH_SECONDS
              value: "900"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              while true; do
                delay="$(awk -v min="$MIN_REFRESH_SECONDS" -v max="$MAX_REFRESH_SECONDS" \
                  'BEGIN { srand(); print int(min + rand() * (max - min + 1)) }')"
                echo "Refreshing Wikipedia page in ${delay} seconds"
                sleep "$delay"

                if curl --fail --silent --show-error --location \
                  --retry 5 \
                  --user-agent kubernetes-course-exercise/5.4 \
                  --output /www/index.html.tmp \
                  https://en.wikipedia.org/wiki/Special:Random; then
                  mv /www/index.html.tmp /www/index.html
                  echo "Wikipedia page refreshed"
                else
                  rm -f /www/index.html.tmp
                  echo "Wikipedia refresh failed; keeping the previous page" >&2
                fi
              done
          volumeMounts:
            - name: wikipedia-content
              mountPath: /www
---
apiVersion: v1
kind: Service
metadata:
  name: wikipedia
spec:
  selector:
    app: wikipedia
  ports:
    - name: http
      port: 80
      targetPort: http
